    <!-- Force unregister old service worker and clear old cache if build version changed -->
    <script>
      const BUILD_VERSION = '20260603_v8';
      if (localStorage.getItem('site_version') !== BUILD_VERSION) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
        localStorage.setItem('site_version', BUILD_VERSION);
        console.log('Cache cleared for version:', BUILD_VERSION);
      }
    </script>
